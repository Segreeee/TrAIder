<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrAIder</title>
<style>
:root {
  color-scheme: light;
  --surface: #f5f7f9;
  --ink: #17202b;
  --ink-2: #556070;
  --rule: #d6dce3;
  --track: #e3e8ee;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --alert: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #151a20;
    --ink: #e8ecf1;
    --ink-2: #a3adba;
    --rule: #2c343e;
    --track: #232b34;
    --series-1: #3987e5;
    --series-2: #d95926;
    --alert: #f2b8b5;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  font-variant-numeric: tabular-nums;
}
main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
h1 {
  font: 600 clamp(1.9rem, 7vw, 2.6rem)/1.1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
}
h2 { font-size: 1.15rem; font-weight: 600; margin: 0 0 12px; }
section { padding: 28px 0 0; margin-top: 28px; border-top: 1px solid var(--rule); }
p { margin: 0 0 12px; }
.muted { color: var(--ink-2); }
.small { font-size: 0.875rem; }
.alert { color: var(--alert); font-weight: 600; }
.meter { margin: 16px 0 0; }
.meter-label { display: flex; justify-content: space-between; font-size: 0.875rem; color: var(--ink-2); }
.meter-track { height: 6px; background: var(--track); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.meter-fill { height: 100%; background: var(--ink); border-radius: 3px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th { text-align: left; font-weight: 600; color: var(--ink-2); padding: 0 12px 6px 0; border-bottom: 1px solid var(--rule); }
td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.num, th.num { text-align: right; }
.nowrap { white-space: nowrap; }
td .muted { font-size: 0.8125rem; }
dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin: 0; }
dt { color: var(--ink-2); }
dd { margin: 0; text-align: right; font-weight: 600; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--ink-2); font-size: 11px; }
svg .label { fill: var(--ink); font-size: 12px; font-weight: 600; }
.axis { stroke: var(--rule); stroke-width: 1; }
.zero { stroke: var(--ink-2); stroke-width: 1; }
.net { stroke: var(--series-1); fill: none; stroke-width: 2; }
.gross { stroke: var(--series-2); fill: none; stroke-width: 2; stroke-dasharray: 5 4; }
.dot-net { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
.dot-gross { fill: var(--series-2); stroke: var(--surface); stroke-width: 2; }
.dot { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.hit { fill: transparent; }
.legend { display: flex; gap: 16px; font-size: 0.875rem; color: var(--ink-2); margin: 0 0 8px; }
.swatch { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--series-1); vertical-align: middle; margin-right: 6px; }
.swatch.gross { border-top: 2px dashed var(--series-2); }
footer { margin-top: 40px; font-size: 0.8125rem; color: var(--ink-2); }
</style>
</head>
<body>
<main>
$hero
$signals
$positions
$curve
$variants
$calibration
$coverage
<footer>Generata il $generated UTC dall'archivio del demone. Solo lettura: la pagina non decide e non invia nulla.</footer>
</main>
</body>
</html>
